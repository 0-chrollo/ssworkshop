<!-- PocketBase JavaScript SDK -->
<script src="https://cdn.jsdelivr.net/gh/pocketbase/js-sdk@v0.21.0/dist/pocketbase.umd.js"></script>

<script>
  // 1. Initialize PocketBase  client
   const pb = new PocketBase('https://tm4r3gfnhe1700v.ba7w.pocketbasecloud.com');

  async function loadEngines() {
    const grid = document.getElementById('product-grid');
    grid.innerHTML = '<p>Loading engines from database...</p>';

    try {
      // 2. Fetch records from your 'Engines' collection
      const records = await pb.collection('Engines').getList(1, 50, {
        sort: '-created',
      });

      grid.innerHTML = '';

      if (records.items.length === 0) {
        grid.innerHTML = '<p>No engines found in inventory yet.</p>';
        return;
      }

      // 3. Loop through database items
      records.items.forEach((engine) => {
        const imageUrl = engine.assets 
          ? pb.files.getUrl(engine, engine.assets) 
          : 'assets/gearboxesand.jpg';

        const title = engine.engine_name || 'Untitled Engine';
        const price = engine.Price || '0';

        const cardHTML = `
          <div class="product-card">
            <div class="product-card-image">
              <img src="${imageUrl}" alt="${title}">
            </div>
            <div class="product-card-body">
              <div class="product-card-category">Engines</div>
              <div class="product-card-title">${title}</div>
              <div class="product-card-price">R ${price}</div>
              <button class="product-card-button">
                <a href="engine-details.html?id=${engine.id}" style="text-decoration: none; color:white; display: flex; align-items: center; justify-content: center; gap: 8px;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                  Enquire
                </a>
              </button>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });

    } catch (error) {
      console.error('PocketBase Error Details:', error);
      grid.innerHTML = '<p style="color: red;">Failed to load inventory. Check your browser console (F12) for details.</p>';
    }
  }

  loadEngines();
</script>




<script src="scripts.js"></script>
